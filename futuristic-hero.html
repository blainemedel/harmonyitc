<!DOCTYPE html>

<head>

  <title>Futuristic Hero &mdash; Together We Build The Future</title>
  
  <!-- Favicon -->

  <!-- Google Fonts: Inter Tight, Oswald, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&family=Oswald:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {

  <!-- React 18 & ReactDOM 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Framer Motion 10 CDN (UMD: window.Motion) -->

  <!-- Babel Standalone for In-Browser JSX Compilation -->

  <style>

      -moz-osx-font-smoothing: grayscale;

</head>
<body class="bg-[#f8fafc] text-[#0c2637]">
  <div id="root"></div>

  <!-- React Application with Framer Motion Orchestration -->
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const { motion, AnimatePresence, useMotionValue, useSpring, useTransform } = window.Motion;

    // -------------------------------------------------------------------------
    // Framer Motion Animation Variants
    // -------------------------------------------------------------------------

    // 1. Entrance Sequence: Pane floats upward smoothly (y: [40, 0], opacity: [0, 1])
    const panelEntranceVariants = {
      hidden: {
        opacity: 0,
        y: 40,
        scale: 0.97,
      },
      visible: {
        opacity: 1,
        y: 0,
        scale: 1,
        transition: {
          duration: 0.95,
          ease: [0.16, 1, 0.3, 1], // Smooth custom cubic bezier
          when: 'beforeChildren',
          staggerChildren: 0.12,
          delayChildren: 0.2,
        },
      },
    };

    // 2. Continuous Ambient Floating Animation: y: [-4, 4] with infinite ease-in-out
    const panelFloatVariants = {
      animate: {
        y: [-4, 4],
        transition: {
          duration: 3.4,
          repeat: Infinity,
          repeatType: 'reverse',
          ease: 'easeInOut',
        },
      },
    };

    // 3. Staggered sequential slide-in tracking delay for typography strings
    const textLineVariants = {
      hidden: {
        opacity: 0,
        y: 18,
        letterSpacing: '0.08em',
      },
      visible: (customTracking) => ({
        opacity: 1,
        y: 0,
        letterSpacing: customTracking || '-0.02em',
        transition: {
          duration: 0.7,
          ease: [0.22, 1, 0.36, 1],
        },
      }),
    };

    /**
     * =========================================================================
     * Component: GlassPanelOverlay
     * =========================================================================
     * The vertical glassmorphism panel (frosted glass card) with sharp/minimally
     * rounded corners, subtle white border outline, faint neon cyan accent ticks,
     * dynamic CSS gradient sheen layer, and exact typography strings.
     */
    function GlassPanelOverlay({
      variantMode = 'standard',
      fontFamily = 'interTight',
      enableFloat = true,
      enableSheen = true,
      enableTilt = true,
      animationKey = 0,
    }) {
      const cardRef = useRef(null);
      const [sheenCoords, setSheenCoords] = useState({ x: 50, y: 50, active: false });

      // Motion values for smooth 3D tilt
      const mouseX = useMotionValue(0);
      const mouseY = useMotionValue(0);
      const springConfig = { damping: 25, stiffness: 180 };
      const rotateX = useSpring(useTransform(mouseY, [-0.5, 0.5], [6, -6]), springConfig);
      const rotateY = useSpring(useTransform(mouseX, [-0.5, 0.5], [-6, 6]), springConfig);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const xPct = Math.max(0, Math.min(100, (x / rect.width) * 100));
        const yPct = Math.max(0, Math.min(100, (y / rect.height) * 100));

        setSheenCoords({ x: xPct, y: yPct, active: true });

        if (enableTilt) {
          mouseX.set((x / rect.width) - 0.5);
          mouseY.set((y / rect.height) - 0.5);
        }
      };

      const handleMouseLeave = () => {
        setSheenCoords((prev) => ({ ...prev, active: false }));
        mouseX.set(0);
        mouseY.set(0);
      };

      const fontClass =
        fontFamily === 'oswald'
          ? 'font-oswald'
          : fontFamily === 'compact'
          ? 'font-["Impact",sans-serif]'
          : 'font-display';

      return (
        <motion.div
          key={animationKey}
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{
            rotateX: enableTilt ? rotateX : 0,
            rotateY: enableTilt ? rotateY : 0,
            transformStyle: 'preserve-3d',
          }}
          variants={panelEntranceVariants}
          initial="hidden"
          animate="visible"
          className="relative w-full h-full select-none overflow-hidden rounded-[6px] border border-white/70 
            backdrop-blur-[10px] bg-white/[0.08] 
            shadow-[0_14px_45px_-6px_rgba(8,30,46,0.14),inset_0_1.5px_1px_0_rgba(255,255,255,0.85)] 
            transition-shadow duration-300 hover:shadow-[0_20px_55px_-4px_rgba(8,30,46,0.22),inset_0_2px_1.5px_0_rgba(255,255,255,0.95)]"
        >
          {/* Ambient Floating Wrapper */}
          <motion.div
            variants={enableFloat ? panelFloatVariants : {}}
            animate={enableFloat ? 'animate' : undefined}
            className="w-full h-full flex flex-col justify-between p-5 sm:p-7 relative z-10"
          >
            {/* Tech UI Corner Ticks matching reference frame markers */}
            {/* Top-Left Corner Tick & Bracket */}
            <div className="absolute top-2.5 left-2.5 pointer-events-none flex items-start">
              <span className="w-4 h-[1.5px] bg-[#8de1f3] opacity-85" />
              <span className="w-[1.5px] h-3 bg-[#8de1f3] -ml-[1.5px] opacity-85" />
            </div>

            {/* Top Center Digital Indicator Dots */}
            <div className="absolute top-2.5 left-1/2 -translate-x-1/2 pointer-events-none flex items-center space-x-1.5 opacity-75">
              <span className="w-1 h-1 rounded-[1px] bg-[#8de1f3]" />
              <span className="w-1 h-1 rounded-[1px] bg-[#8de1f3]" />
              <span className="w-1 h-1 rounded-[1px] bg-[#8de1f3]" />
              <span className="w-1 h-1 rounded-[1px] bg-[#8de1f3]/50" />
            </div>

            {/* Top-Right Corner Tick & Bracket */}
            <div className="absolute top-2.5 right-2.5 pointer-events-none flex items-start justify-end">
              <span className="w-4 h-[1.5px] bg-[#8de1f3] opacity-85" />
              <span className="w-[1.5px] h-3 bg-[#8de1f3] opacity-85" />
            </div>

            {/* Bottom-Left Cyan Tech Pill Badge (#8ae1f2) */}
            <div className="absolute bottom-3 left-3 pointer-events-none flex items-center">
              <div className="w-7 h-1.5 rounded-full bg-[#8ae1f2] shadow-[0_0_10px_#8ae1f2] opacity-90" />
            </div>

            {/* Bottom-Right Corner Tick */}
            <div className="absolute bottom-2.5 right-2.5 pointer-events-none flex items-end justify-end">
              <span className="w-3 h-[1.5px] bg-[#8de1f3] opacity-60" />
              <span className="w-[1.5px] h-2.5 bg-[#8de1f3] opacity-60" />
            </div>

            {/* =================================================================
                TYPOGRAPHY CONTENT CONTAINER
                Adheres strictly to exact text strings and visual weights
            ================================================================= */}
            <div className={`w-full pt-4 sm:pt-6 flex flex-col justify-start ${fontClass}`}>
              
              {/* TOP HEAVY BLOCK: Compact Bold Sans-Serif */}
              <div className="flex flex-col space-y-[2px] sm:space-y-1">
                
                {/* Line 1 (Light Blue, Bold, All Caps): 'TOGETHER' */}
                <motion.div
                  variants={textLineVariants}
                  custom="-0.02em"
                  className="overflow-hidden"
                >
                  <h1 className="text-[28px] xs:text-[32px] sm:text-[40px] md:text-[46px] font-black leading-[0.92] tracking-[-0.02em] text-[#82c9dc] uppercase drop-shadow-[0_1px_1px_rgba(255,255,255,0.7)]">
                    TOGETHER
                  </h1>
                </motion.div>

                {/* Line 2 (Dark Navy, Bold, All Caps): 'WE BUILD' */}
                <motion.div
                  variants={textLineVariants}
                  custom="-0.02em"
                  className="overflow-hidden"
                >
                  <h2 className="text-[28px] xs:text-[32px] sm:text-[40px] md:text-[46px] font-black leading-[0.92] tracking-[-0.02em] text-[#0c2637] uppercase drop-shadow-[0_1px_1px_rgba(255,255,255,0.5)]">
                    WE BUILD
                  </h2>
                </motion.div>

                {/* Line 3 (Light Blue, Bold, All Caps): 'THE FUTURE' */}
                <motion.div
                  variants={textLineVariants}
                  custom="-0.02em"
                  className="overflow-hidden"
                >
                  {variantMode === 'dual' ? (
                    <h3 className="text-[28px] xs:text-[32px] sm:text-[40px] md:text-[46px] font-black leading-[0.92] tracking-[-0.02em] uppercase">
                      <span className="text-[#0c2637]">THE </span>
                      <span className="text-[#82c9dc]">FUTURE</span>
                    </h3>
                  ) : (
                    <h3 className="text-[28px] xs:text-[32px] sm:text-[40px] md:text-[46px] font-black leading-[0.92] tracking-[-0.02em] text-[#82c9dc] uppercase drop-shadow-[0_1px_1px_rgba(255,255,255,0.7)]">
                      THE FUTURE
                    </h3>
                  )}
                </motion.div>
              </div>

              {/* BOTTOM THIN BLOCK: Thin/Regular, All Caps, Extra Letter Spacing */}
              <div className="mt-8 sm:mt-11 flex flex-col space-y-1.5 sm:space-y-2">
                
                {/* Line 4 (Dark Gray/Navy, Thin/Regular, All Caps): 'YOU GROW' */}
                <motion.div
                  variants={textLineVariants}
                  custom="0.28em"
                  className="overflow-hidden"
                >
                  {variantMode === 'dual' ? (
                    <p className="text-[13px] xs:text-[15px] sm:text-[18px] md:text-[20px] font-light tracking-[0.28em] uppercase">
                      <span className="text-[#364c5d]">YOU </span>
                      <span className="text-[#82c9dc]">GROW</span>
                    </p>
                  ) : (
                    <p className="text-[13px] xs:text-[15px] sm:text-[18px] md:text-[20px] font-light tracking-[0.28em] text-[#364c5d] uppercase">
                      YOU GROW
                    </p>
                  )}
                </motion.div>

                {/* Line 5 (Light Blue, Thin/Regular, All Caps): 'WE LEAD' */}
                <motion.div
                  variants={textLineVariants}
                  custom="0.28em"
                  className="overflow-hidden"
                >
                  {variantMode === 'dual' ? (
                    <p className="text-[13px] xs:text-[15px] sm:text-[18px] md:text-[20px] font-light tracking-[0.28em] uppercase">
                      <span className="text-[#364c5d]">WE </span>
                      <span className="text-[#82c9dc]">LEAD</span>
                    </p>
                  ) : (
                    <p className="text-[13px] xs:text-[15px] sm:text-[18px] md:text-[20px] font-light tracking-[0.28em] text-[#82c9dc] uppercase">
                      WE LEAD
                    </p>
                  )}
                </motion.div>
              </div>

            </div>

            {/* Bottom spacer showing robotic palm behind panel */}
            <div className="h-8 sm:h-14" />
          </motion.div>

          {/* DYNAMIC CSS GRADIENT SHEEN LAYER */}
          {enableSheen && (
            <div
              className="absolute inset-0 pointer-events-none transition-opacity duration-300"
              style={{
                opacity: sheenCoords.active ? 1 : 0.35,
                background: sheenCoords.active
                  ? `radial-gradient(400px circle at ${sheenCoords.x}% ${sheenCoords.y}%, rgba(255,255,255,0.55) 0%, rgba(138,225,242,0.18) 35%, transparent 75%)`
                  : 'linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(138,225,242,0.08) 100%)',
              }}
            />
          )}

          {/* Top & Left Specular Bevel Highlights */}
          <div className="absolute top-0 inset-x-0 h-[1.5px] bg-gradient-to-r from-transparent via-white/90 to-transparent pointer-events-none" />
          <div className="absolute inset-y-0 left-0 w-[1px] bg-gradient-to-b from-white/80 via-white/30 to-transparent pointer-events-none" />
        </motion.div>
      );
    }

    /**
     * =========================================================================
     * Component: RoboticGlassCard
     * =========================================================================
     * Layered composition pairing the metallic silver robotic hand graphic with
     * the vertically aligned interactive glassmorphism panel.
     */
    function RoboticGlassCard({
      variantMode,
      fontFamily,
      enableFloat,
      enableSheen,
      enableTilt,
      animationKey,
      className = '',
    }) {
      return (
        <div className={`relative w-full max-w-[440px] aspect-[436/534] mx-auto select-none ${className}`}>
          
          {/* Ambient soft glow aura */}
          <div className="absolute -inset-4 bg-gradient-to-br from-[#8ae1f2]/10 via-[#0c2637]/5 to-transparent rounded-full blur-2xl pointer-events-none" />

          {/* 1. Graphic/Background Element: Metallic robotic hand */}
          <img
            src="./assets/robotic-hand-clean-2x.png"
            alt="Metallic robotic hand holding glass panel"
            className="absolute inset-0 w-full h-full object-contain pointer-events-none select-none drop-shadow-[0_24px_48px_rgba(8,30,46,0.15)]"
            draggable="false"
          />

          {/* 2. Text/Card Overlay: Vertically aligned floating glass panel */}
          <div
            className="absolute"
            style={{
              left: '21.5%',
              top: '4.8%',
              width: '52%',
              height: '71.6%',
            }}
          >
            <GlassPanelOverlay
              variantMode={variantMode}
              fontFamily={fontFamily}
              enableFloat={enableFloat}
              enableSheen={enableSheen}
              enableTilt={enableTilt}
              animationKey={animationKey}
            />
          </div>

        </div>
      );
    }

    /**
     * =========================================================================
     * Main App Shell: FuturisticHeroApp
     * =========================================================================
     */
    function FuturisticHeroApp() {
      const [viewMode, setViewMode] = useState('hero'); // 'hero' | 'focus' | 'compare' | 'cardOnly'
      const [variantMode, setVariantMode] = useState('standard'); // 'standard' | 'dual'
      const [fontFamily, setFontFamily] = useState('interTight'); // 'interTight' | 'oswald'
      const [enableFloat, setEnableFloat] = useState(true);
      const [enableSheen, setEnableSheen] = useState(true);
      const [enableTilt, setEnableTilt] = useState(true);
      const [animationKey, setAnimationKey] = useState(0);

      // Replay entrance sequence animation
      const handleReplayAnimation = () => {
        setAnimationKey((prev) => prev + 1);
      };

      return (
        <div className="relative min-h-screen w-full bg-[#f8fafc] text-[#0c2637] font-sans overflow-x-hidden flex flex-col justify-between selection:bg-[#8de1f3]/30">
          
          {/* Clean White/Light Grey Canvas Studio Vignette */}
          <div className="fixed inset-0 bg-[radial-gradient(ellipse_80%_80%_at_50%_-10%,#ffffff_30%,#f0f4f8_80%,#e6ecf2_100%)] pointer-events-none" />
          
          {/* High-tech subtle dot matrix */}
          <div
            className="fixed inset-0 opacity-[0.025] pointer-events-none"
            style={{
              backgroundImage: 'radial-gradient(#0c2637 1px, transparent 1px)',
              backgroundSize: '24px 24px',
            }}
          />

          {/* Top Atmospheric Light Bleed */}
          <div className="fixed top-0 right-1/4 w-[600px] h-[500px] bg-[#8de1f3]/10 rounded-full blur-[140px] pointer-events-none" />
          <div className="fixed bottom-0 left-10 w-[500px] h-[500px] bg-[#0c2637]/5 rounded-full blur-[120px] pointer-events-none" />

          {/* -------------------------------------------------------------------
              TOP NAVIGATION BAR
          ------------------------------------------------------------------- */}
          <header className="relative z-20 w-full max-w-7xl mx-auto px-6 py-5 flex items-center justify-between border-b border-[#0c2637]/5">
            
            {/* Logo */}
            <div className="flex items-center space-x-3 cursor-pointer group">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#0c2637] to-[#1c445e] flex items-center justify-center shadow-[0_4px_14px_rgba(12,38,55,0.22)] border border-white/50 group-hover:scale-105 transition-transform">
                <span className="text-[#8de1f3] font-black text-lg tracking-wider">H</span>
              </div>
              <div>
                <span className="font-extrabold text-base tracking-tight text-[#0c2637] block leading-tight">
                  HARMONY<span className="text-[#82c9dc]">ITC</span>
                </span>
                <span className="text-[10px] uppercase tracking-widest text-[#536d7f] font-semibold">
                  SYNTHETIC INTELLIGENCE
                </span>
              </div>
            </div>

            {/* View Selector Tabs */}
            <nav className="hidden md:flex items-center space-x-1 p-1 rounded-full bg-white/80 backdrop-blur-md border border-white/90 shadow-sm">
              <button
                onClick={() => setViewMode('hero')}
                className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all ${
                  viewMode === 'hero'
                    ? 'bg-[#0c2637] text-white shadow-xs'
                    : 'text-[#486377] hover:text-[#0c2637]'
                }`}
              >
                Hero Section
              </button>
              <button
                onClick={() => setViewMode('focus')}
                className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all ${
                  viewMode === 'focus'
                    ? 'bg-[#0c2637] text-white shadow-xs'
                    : 'text-[#486377] hover:text-[#0c2637]'
                }`}
              >
                Focused Card
              </button>
              <button
                onClick={() => setViewMode('compare')}
                className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all ${
                  viewMode === 'compare'
                    ? 'bg-[#0c2637] text-white shadow-xs'
                    : 'text-[#486377] hover:text-[#0c2637]'
                }`}
              >
                Side-by-Side Reference
              </button>
            </nav>

            {/* Actions */}
            <div className="flex items-center space-x-2.5">
              <button
                onClick={handleReplayAnimation}
                title="Replay page entrance sequence & tracking stagger"
                className="px-3.5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider text-[#0c2637] bg-white hover:bg-slate-50 border border-[#0c2637]/15 shadow-xs transition-all flex items-center space-x-1.5"
              >
                <svg className="w-3.5 h-3.5 text-[#82c9dc]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Replay Motion</span>
              </button>

              <button className="px-5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider text-white bg-[#0c2637] hover:bg-[#13374f] shadow-[0_4px_16px_rgba(12,38,55,0.25)] border border-[#8de1f3]/30 transition-all flex items-center space-x-2">
                <span>Deploy Node</span>
                <span className="text-[#8de1f3]">→</span>
              </button>
            </div>

          </header>

          {/* -------------------------------------------------------------------
              MAIN DISPLAY AREA
          ------------------------------------------------------------------- */}
          <main className="relative z-10 w-full max-w-7xl mx-auto px-6 py-6 md:py-10 flex-1 flex flex-col justify-center">
            
            {viewMode === 'hero' && (
              /* ===============================================================
                 MODE 1: FULL HERO SECTION
              =============================================================== */
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-center">
                
                {/* Left Narrative Column */}
                <div className="lg:col-span-6 flex flex-col justify-center space-y-6">
                  
                  <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-white/80 border border-[#8de1f3]/50 shadow-[0_2px_12px_rgba(141,225,243,0.15)] self-start">
                    <span className="w-2 h-2 rounded-full bg-[#8de1f3] animate-pulse" />
                    <span className="text-[11px] font-bold uppercase tracking-[0.2em] text-[#0c2637]">
                      CYBERNETIC CO-PILOT 4.0
                    </span>
                  </div>

                  <div className="space-y-3">
                    <h2 className="text-4xl sm:text-5xl xl:text-6xl font-black text-[#0c2637] tracking-tight leading-[1.04]">
                      Pioneering The Symbiosis Of Human Vision &{' '}
                      <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#0c2637] via-[#2d6486] to-[#82c9dc]">
                        Synthetic Precision.
                      </span>
                    </h2>
                    <p className="text-base sm:text-lg text-[#4a6477] font-normal leading-relaxed pt-2 max-w-xl">
                      Empowering visionary teams with autonomous neural infrastructure, real-time agentic workflows,
                      and tactile glass UI physics designed for the next frontier of intelligence.
                    </p>
                  </div>

                  <div className="flex flex-wrap gap-4 pt-2">
                    <button className="px-7 py-3.5 rounded-xl font-bold text-sm uppercase tracking-wider text-white bg-[#0c2637] hover:bg-[#143a53] shadow-[0_8px_24px_rgba(12,38,55,0.22)] border border-[#8de1f3]/40 flex items-center space-x-3 transition-transform hover:-translate-y-0.5">
                      <span>Initiate Neural Stack</span>
                      <span className="text-[#8de1f3]">↗</span>
                    </button>
                    <button className="px-6 py-3.5 rounded-xl font-bold text-sm uppercase tracking-wider text-[#0c2637] bg-white/80 hover:bg-white border border-[#0c2637]/15 shadow-xs transition-all">
                      Architecture Specs
                    </button>
                  </div>

                  {/* Telemetry Stats */}
                  <div className="grid grid-cols-3 gap-4 pt-6 border-t border-[#0c2637]/10 max-w-lg">
                    <div>
                      <div className="text-2xl sm:text-3xl font-extrabold text-[#0c2637] font-display">
                        99.98<span className="text-[#82c9dc]">%</span>
                      </div>
                      <div className="text-[11px] font-semibold text-[#577285] uppercase tracking-wider mt-0.5">
                        Neural Uptime
                      </div>
                    </div>
                    <div>
                      <div className="text-2xl sm:text-3xl font-extrabold text-[#0c2637] font-display">
                        &lt;12<span className="text-[#82c9dc]">ms</span>
                      </div>
                      <div className="text-[11px] font-semibold text-[#577285] uppercase tracking-wider mt-0.5">
                        Glass Latency
                      </div>
                    </div>
                    <div>
                      <div className="text-2xl sm:text-3xl font-extrabold text-[#0c2637] font-display">
                        10<span className="text-[#82c9dc]">x</span>
                      </div>
                      <div className="text-[11px] font-semibold text-[#577285] uppercase tracking-wider mt-0.5">
                        Autonomous Scale
                      </div>
                    </div>
                  </div>

                </div>

                {/* Right Hero Visual Column: Robotic Hand Holding Glass Card */}
                <div className="lg:col-span-6 flex flex-col items-center justify-center">
                  <RoboticGlassCard
                    variantMode={variantMode}
                    fontFamily={fontFamily}
                    enableFloat={enableFloat}
                    enableSheen={enableSheen}
                    enableTilt={enableTilt}
                    animationKey={animationKey}
                  />
                </div>

              </div>
            )}

            {viewMode === 'focus' && (
              /* ===============================================================
                 MODE 2: FOCUSED 1:1 GRAPHIC REPLICA STUDY
              =============================================================== */
              <div className="flex flex-col items-center justify-center py-4">
                <div className="mb-4 text-center">
                  <span className="text-xs font-bold tracking-[0.25em] text-[#82c9dc] uppercase">
                    Pixel-Accurate Composition Fidelity
                  </span>
                  <h2 className="text-2xl font-black text-[#0c2637] tracking-tight">
                    Robotic Arm & Holographic Glassmorphic Panel
                  </h2>
                </div>

                <RoboticGlassCard
                  variantMode={variantMode}
                  fontFamily={fontFamily}
                  enableFloat={enableFloat}
                  enableSheen={enableSheen}
                  enableTilt={enableTilt}
                  animationKey={animationKey}
                  className="max-w-[480px]"
                />
              </div>
            )}

            {viewMode === 'compare' && (
              /* ===============================================================
                 MODE 3: SIDE-BY-SIDE REFERENCE VERIFICATION
              =============================================================== */
              <div className="w-full flex flex-col items-center justify-center py-2">
                <div className="mb-6 text-center">
                  <span className="text-xs font-bold tracking-[0.25em] text-[#82c9dc] uppercase">
                    1:1 Visual Alignment Audit
                  </span>
                  <h2 className="text-2xl font-black text-[#0c2637] tracking-tight">
                    Live Component vs Reference Design
                  </h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-5xl items-center">
                  {/* Left: Original Reference Photo */}
                  <div className="flex flex-col items-center p-4 rounded-2xl bg-white/70 border border-slate-200 shadow-sm">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#526c7e] mb-3">
                      Original Reference Design
                    </span>
                    <div className="relative w-full max-w-[360px] aspect-[436/534] rounded-lg overflow-hidden border border-slate-200">
                      <img
                        src="./assets/robotic-hand-ref.png"
                        alt="Original reference graphic"
                        className="w-full h-full object-contain"
                      />
                    </div>
                  </div>

                  {/* Right: Live Interactive React Component */}
                  <div className="flex flex-col items-center p-4 rounded-2xl bg-white/70 border border-[#8de1f3]/40 shadow-sm">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#0c2637] mb-3 flex items-center space-x-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping" />
                      <span>Live React + Framer Motion Component</span>
                    </span>
                    <RoboticGlassCard
                      variantMode={variantMode}
                      fontFamily={fontFamily}
                      enableFloat={enableFloat}
                      enableSheen={enableSheen}
                      enableTilt={enableTilt}
                      animationKey={animationKey}
                      className="max-w-[360px]"
                    />
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* -------------------------------------------------------------------
              BOTTOM INTERACTIVE CONTROLS DOCK
          ------------------------------------------------------------------- */}
          <footer className="relative z-20 w-full max-w-4xl mx-auto px-6 pb-6 pt-2">
            <div className="p-3.5 sm:p-4 rounded-2xl bg-white/80 backdrop-blur-xl border border-white/90 shadow-[0_8px_30px_rgba(0,0,0,0.06)] flex flex-wrap items-center justify-between gap-4">
              
              {/* Color Scheme Mode */}
              <div className="flex items-center space-x-2">
                <span className="text-[11px] font-bold uppercase tracking-wider text-[#526c7e]">
                  Color Scheme:
                </span>
                <div className="flex bg-[#edf3f8] p-0.5 rounded-lg">
                  <button
                    onClick={() => setVariantMode('standard')}
                    className={`px-2.5 py-1 text-xs font-semibold rounded-md transition-all ${
                      variantMode === 'standard'
                        ? 'bg-white text-[#0c2637] shadow-xs'
                        : 'text-[#627d91] hover:text-[#0c2637]'
                    }`}
                  >
                    Strict Prompt
                  </button>
                  <button
                    onClick={() => setVariantMode('dual')}
                    className={`px-2.5 py-1 text-xs font-semibold rounded-md transition-all ${
                      variantMode === 'dual'
                        ? 'bg-white text-[#0c2637] shadow-xs'
                        : 'text-[#627d91] hover:text-[#0c2637]'
                    }`}
                  >
                    Dual Accent
                  </button>
                </div>
              </div>

              {/* Typography Switcher */}
              <div className="flex items-center space-x-2">
                <span className="text-[11px] font-bold uppercase tracking-wider text-[#526c7e]">
                  Font:
                </span>
                <div className="flex bg-[#edf3f8] p-0.5 rounded-lg">
                  <button
                    onClick={() => setFontFamily('interTight')}
                    className={`px-2.5 py-1 text-xs font-semibold rounded-md transition-all ${
                      fontFamily === 'interTight'
                        ? 'bg-white text-[#0c2637] shadow-xs'
                        : 'text-[#627d91] hover:text-[#0c2637]'
                    }`}
                  >
                    Inter Tight
                  </button>
                  <button
                    onClick={() => setFontFamily('oswald')}
                    className={`px-2.5 py-1 text-xs font-semibold rounded-md transition-all ${
                      fontFamily === 'oswald'
                        ? 'bg-white text-[#0c2637] shadow-xs'
                        : 'text-[#627d91] hover:text-[#0c2637]'
                    }`}
                  >
                    Oswald
                  </button>
                </div>
              </div>

              {/* Motion Toggles */}
              <div className="flex items-center space-x-3.5">
                <label className="flex items-center space-x-1.5 cursor-pointer text-xs font-semibold text-[#0c2637]">
                  <input
                    type="checkbox"
                    checked={enableFloat}
                    onChange={(e) => setEnableFloat(e.target.checked)}
                    className="rounded text-[#0c2637] focus:ring-[#8de1f3]"
                  />
                  <span>Ambient Float</span>
                </label>
                <label className="flex items-center space-x-1.5 cursor-pointer text-xs font-semibold text-[#0c2637]">
                  <input
                    type="checkbox"
                    checked={enableSheen}
                    onChange={(e) => setEnableSheen(e.target.checked)}
                    className="rounded text-[#0c2637] focus:ring-[#8de1f3]"
                  />
                  <span>Dynamic Sheen</span>
                </label>
                <label className="flex items-center space-x-1.5 cursor-pointer text-xs font-semibold text-[#0c2637]">
                  <input
                    type="checkbox"
                    checked={enableTilt}
                    onChange={(e) => setEnableTilt(e.target.checked)}
                    className="rounded text-[#0c2637] focus:ring-[#8de1f3]"
                  />
                  <span>3D Tilt</span>
                </label>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    // Render application to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FuturisticHeroApp />);
  </script>
</body>
</html>
